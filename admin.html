<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos · Personal</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f8fa;color:#0d2b3e;font:15px/1.4 system-ui,sans-serif;padding:12px}
.card{background:#fff;border:1px solid #dbe8ee;border-radius:12px;padding:12px;margin-bottom:10px;max-width:760px;margin-inline:auto}
button,input,select{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #dbe8ee;background:#fff;min-height:44px}.p{background:#0e7c9b;color:#fff;border:0}.w{background:#f08a4b;border:0;font-weight:700}
.tag{background:#e8f4f6;border-radius:10px;padding:2px 8px}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.mut{color:#5b7686}.err{color:#b3261e}</style></head><body>
<div id="app"></div>
<script>
const $=id=>document.getElementById(id),S=n=>'S/ '+Number(n).toFixed(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let P=[],T,msg='';
const H=()=>({'Content-Type':'application/json','x-clave':encodeURIComponent(localStorage.pw_admin||'')});
function login(){$('app').innerHTML='<div class="card"><h2>Personal</h2><input id="c" type="password" placeholder="Contraseña" onkeydown="if(event.key==\'Enter\')entrar()"> <button class="p" onclick="entrar()">Entrar</button><p class="err" id="e"></p></div>'}
async function entrar(){localStorage.pw_admin=$('c').value;const r=await fetch('/api/admin',{headers:H()});if(r.ok)start();else{localStorage.removeItem('pw_admin');$('e').textContent='Contraseña incorrecta'}}
function start(){load();clearInterval(T);T=setInterval(load,10000)}
async function load(){const r=await fetch('/api/admin',{headers:H()});if(r.status==401)return login();P=(await r.json()).pedidos||[];draw()}
async function act(b){const r=await fetch('/api/admin',{method:'POST',headers:H(),body:JSON.stringify(b)});const d=await r.json();msg=r.ok?(d.receipt?'Registrado en Loyverse: recibo '+d.receipt:''):d.error;load()}
function cobrar(id,m){const metodo=prompt('Método de pago recibido: efectivo, tarjeta o yape',m);if(!metodo)return;const op=metodo.toLowerCase()=='yape'?prompt('N.º de operación de Yape (opcional)')||'':'';if(confirm('¿Registrar este pedido como pagado en Loyverse?'))act({accion:'cobrar',id,metodo:metodo.toLowerCase(),op})}
async function ids(){const d=await(await fetch('/api/config',{headers:H()})).json();alert(d.error?d.error:'TIENDAS\n'+d.tiendas.map(t=>t.name+': '+t.id).join('\n')+'\n\nTIPOS DE PAGO\n'+d.pagos.map(t=>t.name+': '+t.id).join('\n'))}
function draw(){$('app').innerHTML=`<div class="card row"><b>Pedidos</b><button onclick="load()">Actualizar</button><button onclick="ids()">Ver IDs de Loyverse</button></div>${msg?`<div class="card ${msg.startsWith('Registrado')?'':'err'}">${esc(msg)}</div>`:''}`+
 (P.length?P.map(p=>{const it=p.items||[],ab=!['cerrado','cancelado'].includes(p.estado);return `<div class="card"><div class="row"><b>#${p.id} · ${p.tipo=='mesa'?'Mesa '+esc(p.mesa):'Delivery'}</b><span class="tag">${esc(p.estado)}</span><span class="tag">${esc(p.metodo)}</span><b>${S(p.total)}</b></div>
 <div>${it.map(i=>`${i.q} × ${esc(i.n)}`).join('<br>')}</div><div class="mut">${esc(p.nombre)} · ${esc(p.telefono)}${p.direccion?'<br>'+esc(p.direccion):''}${p.nota?'<br>“'+esc(p.nota)+'”':''}${p.receipt?'<br>Recibo Loyverse: '+esc(p.receipt):''}</div>
 ${ab?`<div class="row"><button onclick="act({accion:'estado',id:${p.id},estado:'preparando'})">Preparando</button><button onclick="act({accion:'estado',id:${p.id},estado:'listo'})">Listo</button>${p.tipo=='delivery'?`<button onclick="act({accion:'estado',id:${p.id},estado:'en_camino'})">En camino</button>`:''}<button class="w" onclick="cobrar(${p.id},'${esc(p.metodo)}')">Cobrar y registrar</button><button onclick="if(confirm('¿Cancelar el pedido?'))act({accion:'estado',id:${p.id},estado:'cancelado'})">Cancelar</button></div>`:''}</div>`}).join(''):'<div class="card mut">No hay pedidos.</div>')}
localStorage.pw_admin?start():login();
</script></body></html>
