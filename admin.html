<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mistura Fish · Personal</title><link rel="stylesheet" href="/styles.css"><style>main{max-width:950px;padding-top:30px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tag{background:#faf4e6;padding:5px 10px;border-radius:20px}.muted{white-space:pre-line}.login{max-width:420px;margin:50px auto}.panel h2{margin-bottom:12px}</style></head><body><header class="site-header"><a class="brand" href="/">Mistura Fish</a><span class="pill">Personal</span></header><main><div id="app"></div></main><script type="module">
const $=id=>document.getElementById(id),S=n=>'S/ '+Number(n).toFixed(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let P=[],T,password='',busy=false;
const H=()=>({'Content-Type':'application/json','x-clave':encodeURIComponent(password)});
async function api(path='admin',body){const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:H(),...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw new Error(d.error||'No se pudo completar la operación.');return d;}
function message(text){if($('msg'))$('msg').textContent=text;}
function login(){clearInterval(T);password='';$('app').innerHTML='<form class="panel login"><span class="eyebrow">SOLO PERSONAL</span><h2>Atendamos algo rico.</h2><label>Contraseña<input id="c" type="password" required autocomplete="current-password"></label><p class="form-error" id="e" role="alert"></p><button class="button primary full">Entrar</button></form>';$('app').querySelector('form').onsubmit=async e=>{e.preventDefault();password=$('c').value;try{await load();T=setInterval(()=>load().catch(e=>message(e.message)),15000);}catch(error){$('e').textContent=error.message;}};}
async function load(){if(busy)return;P=(await api()).pedidos||[];draw();}
async function act(body){busy=true;let result,error;try{result=await api('admin',body);}catch(e){error=e;}finally{busy=false;await load().catch(()=>{});message(error?error.message:result.receipt?'Registrado en Loyverse: '+result.receipt:'Estado actualizado.');}}
function draw(){
  $('app').innerHTML='<div class="panel row"><h2 style="margin:0 auto 0 0">Pedidos</h2><button class="button secondary" id="refresh">Actualizar</button><button class="button secondary" id="ids">Ver IDs de Loyverse</button><button class="text-button" id="logout">Salir</button></div><p class="form-error" id="msg" role="status"></p>'+ (P.length?P.map(p=>{
    const bill=p.comprobante||{},open=!['cerrado','cancelado'].includes(p.estado),sync=['sending','uncertain'].includes(p.sync_state);
    return '<article class="panel"><div class="row"><h2>#'+p.id+' · '+(p.tipo==='mesa'?'Mesa '+esc(p.mesa):'Delivery')+'</h2><span class="tag">'+esc(p.estado)+'</span><span class="tag">'+esc(p.metodo)+'</span><b>'+S(p.total)+'</b></div><p>'+(p.items||[]).map(i=>i.q+' × '+esc(i.n)).join('<br>')+'</p><p class="muted">'+esc(p.nombre)+' · '+esc(p.telefono||'Sin celular')+(p.direccion?'<br>'+esc(p.direccion):'')+(p.nota?'<br>Nota: '+esc(p.nota):'')+'</p><p class="muted">Comprobante solicitado: '+esc(bill.type||'Sin datos')+' · '+esc(bill.document||'Sin documento')+' '+esc(bill.company||'')+'<br>Correo: '+esc(bill.email||'No indicado')+'<br>Contacto WhatsApp del pedido: '+(p.notificaciones_whatsapp?'Solicitado':'No solicitado')+'</p>'+(p.receipt?'<p>Recibo Loyverse: <b>'+esc(p.receipt)+'</b></p>':'')+(sync?'<p class="muted">Registro de cobro pendiente de revisión. Se buscará el recibo en Loyverse sin reenviarlo automáticamente.</p>':'')+(open?'<div class="row">'+(!sync?['preparando','listo',...(p.tipo==='delivery'?['en_camino']:[])].map(s=>'<button class="button secondary" data-id="'+p.id+'" data-state="'+s+'">'+s.replace('_',' ')+'</button>').join(''):'')+'<button class="button gold" data-id="'+p.id+'" data-charge="'+esc(p.metodo)+'">'+(sync?'Revisar recibo':'Cobrar y registrar')+'</button>'+(!sync?'<button class="text-button" data-id="'+p.id+'" data-state="cancelado">Cancelar</button>':'')+'</div>':'')+'</article>';
  }).join(''):'<div class="panel">No hay pedidos.</div>');
  $('refresh').onclick=()=>load().catch(e=>message(e.message));$('logout').onclick=login;$('ids').onclick=async()=>{try{const d=await api('config');alert('TIENDAS\n'+d.tiendas.map(t=>t.name+': '+t.id).join('\n')+'\n\nPAGOS\n'+d.pagos.map(t=>t.name+': '+t.id).join('\n'));}catch(e){message(e.message);}};
}
$('app').addEventListener('click',async event=>{const b=event.target.closest('[data-id]');if(!b||busy)return;
  if(b.dataset.state){if(b.dataset.state==='cancelado'&&!confirm('¿Cancelar este pedido?'))return;await act({accion:'estado',id:Number(b.dataset.id),estado:b.dataset.state});}
  else{const metodo=prompt('Método de pago recibido: efectivo, tarjeta o yape',b.dataset.charge);if(!metodo)return;if(confirm('Confirma solo si verificaste el pago recibido. ¿Registrar o revisar el recibo en Loyverse?'))await act({accion:'cobrar',id:Number(b.dataset.id),metodo:metodo.trim().toLowerCase()});}
});
login();
</script></body></html>
