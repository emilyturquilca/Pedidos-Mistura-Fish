<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR de la carta · Mistura Fish</title><link rel="stylesheet" href="/online.css"><link rel="stylesheet" href="/carta.css"><script src="/assets/qrcode.js"></script></head><body><main class="privacy-copy"><p class="eyebrow">MISTURA FISH · CARTA DIGITAL</p><h1>De la mesa a la carta.</h1><p>Imprime un QR general o añade el número de mesa para que aparezca al pedir.</p><label>Mesa (opcional)<input id="table" maxlength="40" placeholder="Ej.: 4"></label><div id="qr" style="padding:25px;background:white;max-width:320px"></div><p><a id="url"></a></p><a id="download" class="primary" download="mistura-carta.svg">Descargar QR</a><p><a href="/">Ver carta</a> · <a href="/admin.html">Acceso del personal</a></p></main><script>
let previous;function draw(){const u=new URL('https://pedidos-mistura-fish.vercel.app/');const table=document.getElementById('table').value.trim();if(table)u.searchParams.set('mesa',table);const q=qrcode(0,'M');q.addData(u.href);q.make();const svg=q.createSvgTag({cellSize:5,margin:4,scalable:true});document.getElementById('qr').innerHTML=svg;const a=document.getElementById('url');a.href=u.href;a.textContent=u.href;if(previous)URL.revokeObjectURL(previous);previous=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));document.getElementById('download').href=previous;}document.getElementById('table').addEventListener('input',draw);draw();
</script></body></html>
